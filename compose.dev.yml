services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${OMNI_DB_USER}
      POSTGRES_PASSWORD: ${OMNI_DB_PASS}
      POSTGRES_DB: ${OMNI_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "${OMNI_DB_PORT}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OMNI_DB_USER} -d ${OMNI_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
